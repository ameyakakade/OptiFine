# Builds the compiler and runs both test suites on every push to main and
# every pull request. Neither suite starts Avrora or needs the AVR toolchain:
# the C tests run generated programs in the test-only AVR interpreter, and
# the Python tests revalidate the retained evidence under sim/fixtures/ from
# its raw files. Full simulator reproduction is documented in
# docs/REPRODUCIBILITY.md and is not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest==9.1.1

      # Default (Debug) build: the C tests rely on assert(), which a
      # Release build's NDEBUG would compile out.
      - name: Configure
        run: cmake -S compiler -B compiler/build

      - name: Build
        run: cmake --build compiler/build --parallel

      - name: C tests
        run: ctest --test-dir compiler/build --output-on-failure

      - name: Python tests
        run: python -m pytest sim/tests
